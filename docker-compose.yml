version: '3.4'

services:
  magazine.web:
    image: ${DOCKER_REGISTRY-}magazine-web-image
    container_name: magazine-web-container
    build:
      context: ./Source
      dockerfile: Dockerfile
    ports:
        - "63585:8000"
  magazine.db:
    image: ${DOCKER_REGISTRY-}magazine-db-image
    container_name: magazine-db-container
    build:
      context: ./Database
      dockerfile: Dockerfile
    ports:
        - "5436:5432"
