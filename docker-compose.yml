version: '3.4'

services:

    # Angular Web Application "Infotecs Magazine"
    magazine.web:
        image: ${DOCKER_REGISTRY-}magazine-web-image
        container_name: magazine-web-container
        restart: always
        build:
            context: ./Source
            dockerfile: Magazine.Web/Dockerfile
        depends_on:
            - magazine.api
        ports:
            - 63585:8000

    # Web API "Infotecs Magazine API"
    magazine.api:
        image: ${DOCKER_REGISTRY-}magazine-api-image
        container_name: magazine-api-container
        restart: always
        build:
            context: ./Source
            dockerfile: Magazine.API/Dockerfile
        depends_on:
            - magazine.db
        ports:
            - 63588:5000

    # PostgreSQL Database "Infotecs Magazine Database"
    magazine.db:
        image: ${DOCKER_REGISTRY-}magazine-db-image
        container_name: magazine-db-container
        restart: always
        build:
            context: ./Database
            dockerfile: Dockerfile
        ports:
            - 5436:5432
      
    # Reverse Proxy Web Server "Nginx"
    nginx:
        image: ${DOCKER_REGISTRY-}nginx-image
        container_name: nginx-container
        restart: always
        build:
            context: ./Nginx
            dockerfile: Dockerfile
        depends_on:
            - magazine.api
            - magazine.web
        ports:
            - 5496:8081    # magazine.api
            - 5498:8080    # magazine.web
