<div class="container">
    <div class="row">
        <div class="col">
            <button id="write-comment-button" class="btn btn-primary" (click)="createComment()">Write Comment</button>
        </div>
    </div>
    <div class="row">
        <div class="col">
            <ul class="list-group">
                <li class="list-group-item list-group-item-action"
                    *ngFor="let comment of comments">

                    {{ comment.body }}

                </li>
            </ul>
        </div>
    </div>
</div>
