<div class="container">
    <div class="row">
        <div class="col">
            <ul class="list-group">
                <li class="list-group-item list-group-item-action"
                    *ngFor="let article of articles"
                    [class.selected]="article.id === selectedId"
                    (click)="navigateToArticle(article)">

                    {{ article.title }}

                </li>
            </ul>
        </div>
    </div>
</div>
