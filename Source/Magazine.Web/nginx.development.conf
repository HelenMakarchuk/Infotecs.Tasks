worker_processes 4;

events { worker_connections 1024; }

http {

    sendfile on;

    # Web
    server {
        listen 5498;
        include etc/nginx/mime.types;

        location / {
            root var/www/html/;
            try_files $uri $uri/ /index.html;
        }

        location /identity {
			proxy_pass http://localhost:5082/identity;
        }

		location /lib/ {
			 proxy_pass http://localhost:5082/lib/;
		}

		location /css/ {
			 proxy_pass http://localhost:5082/css/;
		}

		location /icons/ {
			 proxy_pass http://localhost:5082/icons/;
		}

		location /identity/.well-known/ {
			 proxy_pass http://localhost:5082/.well-known/;
		}

        location /api {
            proxy_pass         http://localhost:5080/api;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }

        location /default {
            root var/www/html/;
            try_files $uri /default.html;
        }
    }
}
