<div>
  <input id="title"
         type="text"
         class="form-control"
         [(ngModel)]="article.title"
         [readonly]="isReadonly"
         placeholder="Enter title">

  <textarea class="form-control"
            [readonly]="isReadonly"
            [(ngModel)]="article.body"
            placeholder="Enter body"
            rows="15">
            {{ article.body }}
  </textarea>

  <div>
    <button class="btn btn-primary" (click)="navigateToArticles()">Back</button>
    <button class="btn btn-primary" (click)="updateArticle()" *ngIf=isReadonly>Edit</button>
    <button class="btn btn-primary" (click)="updateArticle()" *ngIf=!isReadonly>Save</button>
    <button class="btn btn-primary" (click)="deleteArticle() *ngIf=isReadonly">Delete</button>
  </div>
</div>
