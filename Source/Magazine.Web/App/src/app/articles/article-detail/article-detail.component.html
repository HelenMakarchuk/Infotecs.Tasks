<div *ngIf="article$ | async as article">
  <h3>"{{ article.title }}"</h3>
  <div>
    <label>Id: </label>{{ article.id }}
  </div>
  <div>
    <label>Name: </label>
    <input [(ngModel)]="article.title" placeholder="title" />
  </div>
  <p>
    <button (click)="navigateToArticles(article)">Back</button>
    <button (click)="updateArticle(article)">Update</button>
    <button (click)="deleteArticle(article)">Delete</button>
  </p>
</div>
