<a mat-raised-button [routerLink]="['/articles/create']">Write Article</a>

<!-- TODO: card page -->

<ul class="articles">
  <li *ngFor="let article of articles$ | async"
      [class.selected]="article.id === selectedId">
    <a [routerLink]="['/article', article.id]">
      <span class="badge">{{ article.id }}</span>{{ article.title }}
    </a>
  </li>
</ul>
